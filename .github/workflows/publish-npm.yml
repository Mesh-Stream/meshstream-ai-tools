name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - id: docs-version
        name: Check docs package version
        shell: bash
        run: |
          version=$(node -p "require('./packages/docs-mcp/package.json').version")
          if npm view "@meshstream/docs-mcp@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - id: agent-version
        name: Check agent package version
        shell: bash
        run: |
          version=$(node -p "require('./packages/agent-skills/package.json').version")
          if npm view "@meshstream/agent-skills@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.docs-version.outputs.exists != 'true'
        run: npm publish --workspace @meshstream/docs-mcp --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - if: steps.agent-version.outputs.exists != 'true'
        run: npm publish --workspace @meshstream/agent-skills --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
